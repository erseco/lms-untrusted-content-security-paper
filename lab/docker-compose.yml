---
# Disposable lab for the cross-host isolation-probe matrix (Moodle, Omeka S,
# Nextcloud). Adapted from mod_exelearning/docker-compose.yml: same `moodle` +
# `db` services and the same POST_CONFIGURE_COMMANDS that install the plugin and
# seed the demo course. alpine-moodle only behaves on http://localhost:80, so the
# lab publishes :80 and run-matrix.sh frees it first (stopping any other :80
# container, then restoring it). No reverse-proxy / custom-port tricks.

services:

  moodle:
    image: erseco/alpine-moodle:${MOODLE_VERSION:-v5.0.8}
    restart: unless-stopped
    environment:
      LANG: es_ES.UTF-8
      LANGUAGE: es_ES:es
      SITE_URL: http://localhost
      DB_TYPE: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: moodle
      DB_USER: root
      DB_PASS: moodle
      DB_PREFIX: mdl_
      DEBUG: true
      MOODLE_EMAIL: ${TEST_USER_EMAIL:-user@exelearning.net}
      MOODLE_LANGUAGE: es
      MOODLE_SITENAME: Moodle-eXeLearning-Lab
      MOODLE_USERNAME: ${TEST_USER_USERNAME:-user}
      MOODLE_PASSWORD: ${TEST_USER_PASSWORD:-1234}
      PRE_CONFIGURE_COMMANDS: |
        echo 'lab: pre-configure'
      POST_CONFIGURE_COMMANDS: |
        echo 'mod_exelearning lab: post-configure (vanilla; plugin installed by run-matrix.sh)'
    ports:
      - 80:8080
    volumes:
      - moodledata:/var/www/moodledata
      - moodlehtml:/var/www/html
      # Pinned plugin checkout (fetch-plugin.sh), staged OUTSIDE the webroot. The
      # image boots vanilla Moodle; install-plugin.sh then copies it into Moodle's
      # real $CFG->dirroot/mod (which differs by version: /var/www/html on 4.5/5.0,
      # /var/www/html/public on 5.2+/dev) and runs the upgrade + demo seed. Bind-
      # mounting into the webroot would clobber the image's docroot setup and 404 all
      # of Moodle. The matrix needs the secure-iframe branch (mod_exelearning
      # 73fe6ff: iframemode=secure|legacy).
      - ./mod_exelearning:/opt/mod_exelearning:ro
    depends_on:
      - db

  # No official Omeka S image exists. erseco/alpine-omeka-s:latest pulled fine
  # (Step 1, 2026-07-25) so we use it as-is rather than the omeka.Dockerfile
  # fallback. It's an alpine/nginx+php-fpm image in the same family as
  # erseco/alpine-moodle: nginx listens on 8080 (NOT 80 — confirmed via `docker
  # inspect`, its own Dockerfile is not public), and the webroot runs as
  # nobody:nobody, not www-data. Its entrypoint
  # (/docker-entrypoint-init.d/02-configure-omeka.sh) only runs `install_cli.php`
  # when EMAIL, NAME, PASSWORD and SITE_TITLE are *all* set — OMEKA_ADMIN_NAME is
  # required even though it wasn't in the original plan, or the site boots to the
  # first-run install wizard instead of a seeded admin account.
  omeka:
    image: ${OMEKA_IMAGE:-erseco/alpine-omeka-s:latest}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: omeka
      DB_USER: root
      DB_PASSWORD: moodle
      OMEKA_ADMIN_EMAIL: ${TEST_USER_EMAIL:-user@exelearning.net}
      OMEKA_ADMIN_NAME: ${TEST_USER_USERNAME:-user}
      OMEKA_ADMIN_PASSWORD: ${TEST_USER_PASSWORD:-1234}
      OMEKA_SITE_TITLE: Omeka-eXeLearning-Lab
    ports:
      - 8081:8080
    volumes:
      - omekafiles:/var/www/html/files
      # Optional checkout point for an eXeLearning module for Omeka S. No such
      # module exists upstream yet, so this directory is absent by default;
      # install-omeka-module.sh detects that and skips the copy instead of
      # installing an empty module.
      - ./omeka-s-exelearning:/opt/omeka-s-exelearning:ro
    depends_on:
      - db

  # Official image, SQLite-backed (no dependency on the `db` service — it only
  # needs Omeka's MySQL, so nextcloud stays self-contained here).
  nextcloud:
    image: nextcloud:apache
    restart: unless-stopped
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER: ${TEST_USER_USERNAME:-user}
      NEXTCLOUD_ADMIN_PASSWORD: ${TEST_USER_PASSWORD:-1234}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
    ports:
      - 8082:80
    volumes:
      - ncdata:/var/www/html
      # Optional checkout point for an eXeLearning app for Nextcloud. No such app
      # exists upstream yet, so this directory is absent by default;
      # install-nextcloud-app.sh detects that and falls back to measuring the
      # Files-upload / public-link vector instead.
      - ./nextcloud-exelearning:/opt/nextcloud-exelearning:ro

  db:
    image: mariadb:latest
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: moodle
      MYSQL_ROOT_PASSWORD: moodle
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - dbdata:/var/lib/mysql
      # Runs once, only against an empty datadir: creates the extra `omeka`
      # database alongside `moodle` (MYSQL_DATABASE above) so both hosts share
      # this one MariaDB server.
      - ./db-init:/docker-entrypoint-initdb.d:ro

volumes:
  dbdata:
  moodledata:
  moodlehtml:
  omekafiles:
  ncdata:
